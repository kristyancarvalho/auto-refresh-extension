name: Task
description: Track repository, tooling, testing, packaging, or documentation work
title: 'task: '
labels: ['type: task']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - background
        - popup
        - options
        - scheduling
        - storage
        - tabs
        - sessions
        - alarms
        - notifications
        - ui
        - accessibility
        - testing
        - docker
        - packaging
        - distribution
        - docs
        - release
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this change needed?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this task achieve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Implementation scope
      description: What is included in this task?
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is explicitly excluded?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this task is complete?
      value: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation commands
      description: Commands that verify the work.
      render: bash
