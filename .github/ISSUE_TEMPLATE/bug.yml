name: Bug report
description: Report incorrect behavior, a regression, or a compatibility problem
title: 'bug: '
labels: ['type: bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the extension is affected?
      options:
        - background
        - popup
        - options
        - scheduling
        - storage
        - tabs
        - sessions
        - alarms
        - notifications
        - ui
        - accessibility
        - packaging
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Browser
      options:
        - Firefox
        - Zen Browser
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        Browser version:
        Operating system:
        Extension version:
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
