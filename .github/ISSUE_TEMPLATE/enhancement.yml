name: Enhancement
description: Suggest new or improved extension behavior
title: 'enhancement: '
labels: ['type: enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the extension should change?
      options:
        - background
        - popup
        - options
        - scheduling
        - storage
        - tabs
        - sessions
        - alarms
        - notifications
        - ui
        - accessibility
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What limitation or need motivates this change?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the extension do after this change?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Implementation scope
      description: What behavior and files are involved?
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is explicitly excluded?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing notes
      description: How should this be tested?
  - type: checkboxes
    id: privacy
    attributes:
      label: Local-first safety
      description: Auto Refresh stays local-first and permission-minimal.
      options:
        - label: This change adds no telemetry, no remote transmission, and no unnecessary permissions.
          required: true
